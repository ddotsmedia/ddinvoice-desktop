name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # pnpm store cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx tools/scripts/fetch-chrome.ts # PDF renderer tests need the pinned Chrome
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
  db:
    # Postgres refuses to run as Administrator on Windows runners, so DB integration tests run here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ddinvoice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ddinvoice_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm test
