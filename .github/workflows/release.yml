name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote, e.g. 0.3.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  pilot:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Fetch vendors (sha256 verified by the fetch scripts)
        run: pnpm vendor
      - name: Build installer (signed when Azure secrets exist, unsigned with a warning otherwise)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: pnpm --filter @ddinvoice/desktop dist
      - name: Smoke test installer (silent install, services, /health, uninstall, data kept)
        shell: pwsh
        run: ./tools/scripts/smoke-installer.ps1
      - name: Create pilot prerelease (not a draft; the updater cannot see drafts)
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v${V}-pilot.${RUN_NUMBER}"
          PREV=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -- '-pilot.' | head -n1 || true)
          mkdir -p assets
          cp release/DDInvoice-Setup-*.exe release/DDInvoice-Setup-*.exe.blockmap release/latest.yml assets/
          cp release/latest.yml assets/pilot.yml
          { echo "Channel: pilot"; echo; git log --pretty='- %s (%h)' ${PREV:+"$PREV..."}"$SHA"; } > notes.md
          gh release create "$TAG" --target "$SHA" --prerelease --title "Pilot $TAG" --notes-file notes.md assets/*
  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote newest pilot to stable
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          PILOT=$(gh release list --limit 200 --json tagName,createdAt \
            | jq -r --arg p "v$VERSION-pilot." '[.[] | select(.tagName | startswith($p))] | sort_by(.createdAt) | last | .tagName // empty')
          [ -n "$PILOT" ] || { echo "No pilot release for $VERSION"; exit 1; }
          git fetch --tags --force
          SHA=$(git rev-list -n1 "$PILOT")
          mkdir -p assets
          gh release download "$PILOT" --dir assets --clobber
          rm -f assets/pilot.yml # stable clients read latest.yml
          gh release create "v$VERSION" --target "$SHA" --latest --title "v$VERSION" --notes "Promoted from $PILOT" assets/*
